schema_version = 1
# 首次建档 2026-11-08（由 uke 仓的 porting.toml schema 复制而来，领域 id 一一对应，
# 便于两条线并排读）。状态词汇与 uke 相同：device-verified / host-verified /
# implemented / not-applicable；本档新增 unknown —— 表示「没有可引用的证据」，
# 不允许把 unknown 写成 implemented。
#
# 两条 OS 线并存：21H461（17.7.11）线已到桌面但 CPU 合成；24A446（27.0.1）线是
# 当前主线，到 APFS/cryptex/owner-cache 层。每个 area 的 status 按「当前主线」给，
# 旧线结论放 findings，并注明线别。

[device]
name = "muyu"
soc = "SM8635"
os_profile = "ipados-27.0.1-24A446"
summary = "Muyu 27-spike: payload reaches APFS SystemCryptex mount and owner-cache enumeration (panel photo 2026-11-08 14:36); the panel is the only log channel — USB CDC ACM (blocked at DEPCFG, 16 probes accepted / 0 executed) and the Linux pstore/init_boot-reader were abandoned 2026-11-08 and their code removed the same day (docs/ABANDONED-CHANNELS.md); device restored to stock 2026-11-08 16:18 with no recorded reason. 17-line desktop (CPU-composed ~1.4 fps) predates this ledger. GMU cold start + full HFI device-verified 2026-10-30; GX rail blocked; GPU paused since 2026-11-02. See docs/HANDOFF-2026-11-08.md and STATUS.md."

[[area]]
id = "configuration"
status = "host-verified"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink"]
paths = ["board.spike27-live.toml", "configs/muyu-userland_defconfig", "patches/xnu/series-spike27"]
inputs = ["Schema-2 board (soc_source = sm7675, os_profile = ipados-27.0.1-24A446); archived into the repo as board.spike27-live.toml on 2026-11-08 16:05, byte-identical to /tmp/spike27/board.toml.",
  "24A446 kernelcache sha256 38e6d9fa5f789b82... — the same OS-profile member the uke line prelinks against (kernel.json inputs.kernelcache_sha256).",
  "Framework UniXNU-27 + /tmp/spike27-out build tree; build env: UNIXNU_DEVICE=/tmp/spike27 UNIXNU_OUT=/tmp/spike27-out."]
configuration = ["schema_version2, SM8635 device on the sm7675 24A446 OS profile, muyu kit, single-layer patch series patches/xnu/series-spike27.",
  "105-token boot config identical across u150-u157; u158/u159 drop exactly muyu_usb=1 muyu_usb_panic=1."]
procedure = ["export UNIXNU_DEVICE=/tmp/spike27 UNIXNU_OUT=/tmp/spike27-out; cd UniXNU-27; ./unixnu build kernel; ./unixnu build payload --data-ramdisk fw/data-seed.img --trust-cache fw/trust-24A446/24A446-original-trust.bundle",
  "python3 UniXNU-muyu/scripts/patch-vendor-boot.py --base /tmp/vendor_boot_base_96m.img --payload <out>/payload/payload.img --output fw/vendor_boot_27-uNNN.img"]
findings = ["The repo's own board.toml is still the 21H461 iPad7,1 template; the live 27-line config lived only in /tmp/spike27 until archived 2026-11-08 16:05. /tmp deletion changes behaviour (UKE-FULL-WALKTHROUGH finding, still true for board.toml itself).",
  "u152-u159 kernel version strings all read '(u151)': the device source was not bumped after u151; multi-MB image diffs between rounds are consistent with LTO/layout churn plus payload repack, and the u157->u158 delta is exactly 989 bytes (FAT timestamps, random-seed, boot-args region).",
  "Last build (16:13) reports mapping_complete=false, runtime_qualified=false, loadable=false, allow_missing=true, missing AppleARMWatchdogTimer + IOHIDFamily, 26 stub sites, Image4 personality dropped; it was flashed anyway (u159) with no recorded decision.",
  "CLEANUP 2026-11-08 21:20, corrected 21:40 (maintainer: 'the 27 line is many AIs handing over, keep it clean'). The 27 line could not build itself from this repo, and four smaller faults hid behind that. (1) patches/xnu/series-spike27 was declared here and in the board file but had never been committed; patches.py does not glob and does not fall back — it raises 'patch series missing' and stops — so every u-round was built from /tmp/spike27, whose copy of the file lived only in the temp tree. Rebuilt from that copy and cross-checked against the framework's own record (xnu-patches.list, 16:12): 72 entries = 67 from the framework's xnu-12377 layer + 5 device patches, in u159's order. The 67 now use the same os:../../../patches/xnu-12377/ relative hop the OS profile series uses, so they resolve in both framework checkouts. (2) The repo carried 19 device patches while the build applied 5: the other 16 are 17-line patches (video console, last-panic replay, watchdog, launchd traces) that were copied in but never listed. Moved to patches/xnu/backlog/ with a README — that is also why the 27 kernel has no STACK64 and no muyu_vc_* console. (3) configs/muyu-27_defconfig does not exist; the board names configs/muyu-userland_defconfig. (4) native-source-storage=1, -bravearkdeferredconsole and muyu-ignition-trace=1 had no parser in any checkout; the first two are uke's names (-ukedeferredconsole / uke-ignition-trace) and for ignition u44's sysctl two-liner only ever existed in /tmp/spike27, so IPADOS27-MIGRATION §6.58.2 is not reproducible from here. All three are comments now.",
  "FRAMEWORK DEVIATION 2026-11-08 21:40: this area says 'Framework UniXNU-27', but the record of what the 16:12 build actually linked (/tmp/spike27-out/.../xnu-patches.list) resolves all 67 compatibility patches through /Users/diannao/pad7pro-xnu/UniXNU/patches/, i.e. the core repo, not UniXNU-27. The two checkouts are no longer identical: offline-owner-boot-manifest.patch, offline-owner-systemos-mount.patch and zzz-boot-progress.patch differ, and the core-repo copies are the newer ones (the UniXNU-27 boot-progress hunk is the older 12-line form). Because the series resolves 'os:' through whichever framework is in use, the same series produces different kernels in the two. scripts/audit-27-config.py reports the divergence; aligning the two checkouts is framework work, not device work."]
completion = ["defconfig/kernel/payload build completes and the prelinked MH_FILESET kernel.macho is produced; boot config embedded in the payload is machine-readable from the images."]
limits = ["No manifest/hash verification of the packed image (uke's release/verify step is not used). The unqualified-final-build policy is undocumented."]
next_action = ["Record why the 16:13 unqualified build was flashed; decide a policy for loadable=false candidates; keep board.spike27-live.toml as the single source and reconcile repo board.toml."]
evidence = [
  { kind = "host", reference = "docs/HANDOFF-2026-11-08.md §3", result = "u158 = u157 + 989 bytes: FAT timestamps + chosen random-seed + boot-args region removing muyu_usb/muyu_usb_panic", command = "python3 diff-clusters vendor_boot_27-u157.img vendor_boot_27-u158.img", revision = "images fw/vendor_boot_27-u157.img 27507b1e... / u158 0bf6ba5f..." },
  { kind = "host", reference = "kernel/kernel.json", result = "kernelcache_sha256 38e6d9fa... equals the uke-recorded 24A446 member; candidate 95,764,480 B sha256 7b083c24..., loadable=false", command = "cat /tmp/spike27-out/muyu/ipados-27.0.1-24A446/muyu-27/kernel/kernel.json", revision = "2026-11-08 16:13 build" },
  { kind = "host", reference = "board.spike27-live.toml", result = "byte-identical to /tmp/spike27/board.toml at archive time", command = "diff /tmp/spike27/board.toml UniXNU-muyu/board.spike27-live.toml", revision = "2026-11-08 16:05" },
]

