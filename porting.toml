inputs = ["SHNGROOT container on userdata: windows OS + SystemOS (sparse images fw/userdata-root-preboot*.sparse, 8.74-15.2 GiB variants, five flashes 2026-11-03..11-06 per ledger).",
  "Persistent Data: packed_data_ramdisk/persistent_data/sheng-data-persist=2; data-seed.img (DBRDISK1, 1.04 MiB) is only the first-boot seed.",
  "24A446 trust cache bundle fw/trust-24A446/24A446-original-trust.bundle."]
configuration = ["native-ufs-allow-unverified=1 native-ufs-diagnostics=1 native-ufs-smmu-takeover=1 muyu-source-storage=1 native-ufs-root=1 (all rounds u150-u159). Note: native-source-storage=1 sat in this list by mistake and was dropped 2026-11-08 — that is uke's name, this repo's SourceStorage.cpp gates on muyu-source-storage. See docs/IPADOS27-MIGRATION.md §6.47."]
procedure = ["Flash userdata-root sparse + vendor_boot; boot; read panel log; for persistence, reboot with sheng-data-persist=2 and compare page counts."]
findings = ["Panel 2026-11-08 14:36 (u155): NativeUfs OS volume ready; apfs mounts Rave24A446...SystemCryptex requested by init (pid 1), vol-uuid F7914C52..., 4096x1465320 unencrypted; stable checkpoint indices desc 6 data 14 — the cryptex mount path works on hardware.",
  "Owner-cache enumeration reaches the dyld_shared_cache_arm64e file list under /System/Library/Caches and /System/Cryptexes/OS (probe/composed 0/0 — files listed, contents not yet composed).",
  "Data persistence proven across boots on the 27 line (HANDOFF-2026-11-07 §17-§25): u102 d=7 (Data doomed read-only with default layout), u103 reset=1 makes Data writable (Fresh, 91 pages, 0 errors), u110 store Resumed 91->147 pages; limits: Data cannot be both the cryptex staging layer and /private/var (IPADOS27-MIGRATION.md).",
  "The 21H461 line used the same SHNGROOT container on device (fw/userdata-root-preboot.sparse inspected: magic SHNGROOT, version 1, 2 windows)."]
completion = ["OS/SystemOS windows authenticate, APFS mounts the SystemCryptex, Data persists across reboots when reset=1 is used."]
limits = ["Cryptex contents not yet composed into the owner cache (0/0); Data-only-read-only tension with cryptex staging unresolved."]
next_action = ["Compose the owner cache from the enumerated cryptex files; keep the Data layout decision (reset policy) explicit per boot."]
evidence = [
  { kind = "device", reference = "logs/2026-11-08-14-36-26-878.jpg", result = "panel shows NativeUfs OS volume ready + apfs mount of SystemCryptex + owner-cache enumeration", command = "photo transcription in docs/HANDOFF-2026-11-08.md §5", revision = "u155, flashed 2026-11-08T06:35:19Z" },
