  "Stock vendor_boot template (/tmp/vendor_boot_base_96m.img) patched with the payload ramdisk."]
configuration = ["boot partition carries the UEFI fd; vendor_boot carries the XNU payload via patch-vendor-boot.py; ABL boots the init_boot ramdisk (stock Android) — see diagnostics."]
procedure = ["tools/muyu-flash-mode.sh xnu fw/vendor_boot_27-uNNN.img (preflight + flash vendor_boot + fastboot boot boot.img, all ledgered)"]
findings = ["The vendor_boot patch pipeline has been exercised hundreds of times per the ledger (2651 rows) without a packaging failure.",
  "The EDK2/UEFI artifact is a 2026-11-05 build not regenerated by the current flow; UniXNU/out deletion would lose it (UKE-FULL-WALKTHROUGH §5, unchanged)."]
completion = ["UEFI menu boots the payload entry from vendor_boot on this device."]
limits = ["UEFI firmware itself is not rebuilt by the current flow; no verify step; 'firmware' here means the boot path, not a re-qualified FD build."]
next_action = ["Regenerate boot.img from Mu-Silicium sources once, record its sha, and add it to the ledger as a build step rather than a reused artifact."]
evidence = [
  { kind = "device", reference = "logs/flash-ledger.tsv", result = "hundreds of preflight+flash vendor_boot+boot rows with rc=0 through 2026-11-08", command = "grep -c preflight logs/flash-ledger.tsv", revision = "u159 2026-11-08T08:14:20Z" },
]

